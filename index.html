<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>4S SIGNAL LAB — The Four-Second Challenge</title>
<style>
:root{--bg:#090d18;--surface:#10182a;--surface2:#152139;--line:#2a3a52;--txt:#ecf4ff;--muted:#9cadc6;--cyan:#6de0d5;--blue:#83a7ff;--amber:#f7c985;--red:#f09b9b;--green:#a3e5ae;--radius:19px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse 75% 52% at 75% -10%,#253963 0%,transparent 65%),radial-gradient(ellipse 45% 42% at 0% 37%,#102c35 0%,transparent 76%),var(--bg);color:var(--txt);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.55}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}button{transition:background .18s,transform .18s,border-color .18s}button:hover:not(:disabled){transform:translateY(-1px)}.shell{width:min(1080px,calc(100% - 36px));margin:auto}.top{padding:25px 0 20px;display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid rgba(167,196,237,.15)}.brand{display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.15em;font-weight:800}.brandmark{height:34px;width:34px;border:1px solid #477c98;border-radius:11px;display:grid;place-items:center;color:var(--cyan);font-size:15px;background:#132b36}.nav{display:flex;gap:5px;flex-wrap:wrap}.nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:8px 12px;border-radius:999px;font-size:13px}.nav button.active{border-color:#43607b;background:#1a2b46;color:var(--txt)}.nav button:hover{background:#17243b}.hero{padding:56px 0 27px}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:.2em;font-weight:800;color:var(--cyan);display:flex;align-items:center;gap:9px}.dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 20px var(--cyan)}h1{font-weight:750;line-height:1.06;letter-spacing:-.055em;font-size:clamp(43px,6.2vw,76px);max-width:940px;margin:15px 0 15px}h1 em{font-style:normal;color:var(--cyan)}.lead{font-size:clamp(15px,2vw,18px);max-width:730px;color:#c4d2e5;margin:0 0 18px}.small{font-size:12px;color:var(--muted)}.label{color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:750;letter-spacing:.12em}.section{padding:20px 0 34px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}.section-head h2{font-size:25px;letter-spacing:-.03em;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.panel{border:1px solid var(--line);border-radius:var(--radius);padding:22px;background:linear-gradient(145deg,rgba(22,34,57,.92),rgba(12,19,34,.92));box-shadow:0 14px 48px #0002}.campaign{display:block;text-align:left;color:inherit;min-height:210px;position:relative;overflow:hidden}.campaign[data-selected=true]{border-color:var(--cyan);box-shadow:inset 0 0 0 1px #6de0d566,0 14px 48px #0002}.campaign .campaign-head{display:flex;align-items:center;justify-content:space-between}.campaign .circle{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid #334861;color:var(--cyan);font-size:20px}.campaign h3{font-size:22px;letter-spacing:-.03em;margin:19px 0 7px}.campaign p{font-size:14px;color:var(--muted);margin:0;max-width:370px}.pill{padding:5px 9px;border:1px solid #40516a;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.08em;color:#b9cbe1}.pill.accent{color:var(--cyan);border-color:#4b847d}.primary{background:var(--cyan);color:#06141b;border:1px solid var(--cyan);padding:13px 20px;font-weight:800;border-radius:12px}.primary:hover{background:#a0f5ec}.secondary{background:#1b2c47;color:var(--txt);border:1px solid #3a526d;padding:13px 20px;font-weight:650;border-radius:12px}.secondary:hover{background:#243958}.ghost{background:transparent;color:var(--muted);border:1px solid #344358;padding:11px 16px;border-radius:11px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0 10px}.info{margin-top:14px;border-left:3px solid #5fbcb3;background:#122630;padding:11px 14px;font-size:13px;color:#b7d9dd;border-radius:0 9px 9px 0}.info.warn{border-left-color:var(--amber);background:#2b251d;color:#f4d8ae}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.kpi{border:1px solid #30405a;border-radius:13px;padding:16px;background:#111d30}.kpi strong{display:block;font-size:32px;line-height:1.2;margin:3px 0 4px;letter-spacing:-.04em}.kpi span{font-size:12px;color:var(--muted)}.stage{width:min(810px,100%);margin:28px auto 40px;text-align:center}.stage .panel{padding:clamp(22px,4vw,48px)}.step{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:28px;text-align:left}.step .pill{white-space:nowrap}.stage h2{font-size:clamp(28px,4.6vw,51px);letter-spacing:-.045em;line-height:1.15;margin:0 0 18px}.stage h2.impact{font-size:clamp(31px,5vw,60px)}.stage p{color:#afc0d5;margin:0 auto 16px;max-width:640px}.stage .controls{justify-content:center;margin-top:25px}.clock{font-variant-numeric:tabular-nums;font-size:clamp(70px,11vw,128px);line-height:1;font-weight:780;letter-spacing:-.075em;margin:8px 0 22px;color:var(--cyan)}.track{width:100%;height:6px;background:#263950;border-radius:99px;overflow:hidden;margin:20px 0 14px}.fill{height:100%;width:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .05s linear}.choice{display:flex;align-items:center;gap:10px;border:1px solid #344b66;border-radius:13px;background:#14233a;padding:13px 15px;margin:9px 0;cursor:pointer;text-align:left;color:#d9e6f9;font-size:14px}.choice:has(input:checked){border-color:var(--cyan);background:#153840}.choice input{accent-color:var(--cyan);width:18px;height:18px;flex-shrink:0}.fields{text-align:left;margin:20px auto;max-width:570px}.fields fieldset{border:0;margin:0 0 20px;padding:0}.fields legend{font-size:13px;color:#c0d1e6;font-weight:800;padding:0 0 7px}.fields textarea{background:#0b1727;color:var(--txt);border:1px solid #344a63;border-radius:11px;min-height:76px;width:100%;padding:11px 12px;resize:vertical}.proof{margin:24px auto;max-width:560px;border:1px solid #39536b;background:#0c1829;padding:20px;border-radius:14px;text-align:left}.proof-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:16px}.proof-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid #24364d}.proof-row strong{font-size:20px;font-variant-numeric:tabular-nums}.metric{font-size:12px;color:#b0c4dc}.arrow{color:var(--cyan);font-weight:800}.bars{display:flex;gap:6px;height:8px;margin:10px 0 5px}.bars i{display:block;flex:1;background:#345269;border-radius:99px}.bars i.hot{background:var(--amber)}.footer{border-top:1px solid #27374d;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:24px 0 36px;margin-top:24px;color:var(--muted);font-size:12px}.resultRow{padding:16px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1.35fr .65fr .65fr .65fr .65fr;gap:10px;align-items:center}.resultRow.header{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0}.resultRow strong{font-size:20px;font-variant-numeric:tabular-nums}.resultRow .hooktext{color:#c4d3e7;font-size:12px;margin-top:7px}.rule{height:1px;background:var(--line);margin:22px 0}.method{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.method .panel{padding:15px}.method strong{display:block;margin:7px 0;font-size:15px}.notice{color:var(--amber);font-size:12px;margin-top:14px}.error{color:var(--red);font-size:13px;min-height:20px}.center{text-align:center}.hidden{display:none!important}
@media(max-width:720px){.top{align-items:flex-start;flex-direction:column;padding-top:18px}.hero{padding:35px 0 13px}.grid,.method{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr 1fr}.kpi{padding:10px}.kpi strong{font-size:23px}.kpi span{font-size:10px}.campaign{min-height:170px}.section-head{align-items:start;flex-direction:column}.resultRow{grid-template-columns:1.15fr repeat(4,.5fr);font-size:11px;gap:4px}.resultRow strong{font-size:16px}.pill{font-size:9px}.controls>*{flex:1}.stage .panel{padding:24px 15px}.proof-row strong{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell"><header class="top"><div class="brand"><div class="brandmark">4S</div><span>PROOF &amp; SIGNAL <span style="color:var(--cyan)">/ SIGNAL LAB</span></span></div><nav class="nav" aria-label="Навигация"><button data-nav="test" class="active">4S Challenge</button><button data-nav="results">Резултати</button><button data-nav="method">Метод</button></nav></header><main id="main" aria-live="polite"></main><footer class="footer"><span>4S SIGNAL METHOD · Internal Validation Demo · v0.1</span><span>Offline / No tracking server / Synthetic proof</span></footer></div>
<script>
(()=>{'use strict';
const storeKey='ps.4s.signal.challenge.v1';
const campaigns={
 defi:{title:'DeFi Guard',sub:'Рискът се променя. А вниманието?',audience:'DeFi / Aave потребители',tag:'PROOF & SIGNAL',icon:'↗',hooks:{A:'Кога ще разберете, че DeFi позицията ви става рискова?',B:'Следите доходността. Но следите ли риска, който я съпътства?'},proofTitle:'Илюстративен рисков сигнал',proofRows:[['Health factor · по-рано','1.26'],['Health factor · по-късно','1.12'],['Статус','Нужда от преглед']],proofNote:'Синтетични числа за демонстрация. Не е real-time Aave позиция, инвестиционна препоръка или доказателство за реален клиентски резултат.'},
 leads:{title:'AI Lead Recovery',sub:'Колко струва забавеният отговор?',audience:'Агенции за недвижими имоти',tag:'TRENDSOLUTIONS',icon:'◎',hooks:{A:'Колко потенциални клиенти губите, докато запитванията чакат отговор?',B:'Клиентът вече ви е писал. Защо още чака отговор?'},proofTitle:'Илюстративен преглед на запитвания',proofRows:[['Входящи запитвания','12'],['Без отговор над 15 минути','4'],['Проверка','Нужда от реакция']],proofNote:'Всички бройки и интервали са синтетични, а не данни от клиентска агенция. Не доказват реална загуба на приходи.'}
};
const state={nav:'test',campaign:'defi',phase:'ready',session:null,startedPerf:0,timer:null,records:load(),message:''};
const main=document.getElementById('main');
function load(){try{const v=JSON.parse(localStorage.getItem(storeKey)||'[]');return Array.isArray(v)?v:[]}catch{return []}}
function save(){try{localStorage.setItem(storeKey,JSON.stringify(state.records));return true}catch{return false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rand(){const a=new Uint32Array(1);if(window.crypto?.getRandomValues){window.crypto.getRandomValues(a);return a[0]/4294967296}return Math.random()}
function id(){return '4S-'+new Date().toISOString().replace(/[-:.TZ]/g,'').slice(0,14)+'-'+Math.floor(rand()*100000).toString().padStart(5,'0')}
function event(name,extra){if(!state.session)return;state.session.events.push({at:new Date().toISOString(),type:name,...extra});state.session.updatedAt=new Date().toISOString();save()}
function setPhase(p){state.phase=p;if(state.session){state.session.phase=p;event('phase',{value:p})}render()}
function head(){return `<div class="hero"><div class="eyebrow"><span class="dot"></span> 4S-EXP-001 / INTERNAL DEMO / NOT VALIDATED</div><h1>Имаш <em>4 секунди.</em><br>Какво ще запомниш?</h1><p class="lead">Един въпрос. Четири секунди. После проверяваме дали посланието създава смисъл — а не просто спира скрола.</p></div>`}
function campaignCard(k){const c=campaigns[k];return `<button class="campaign panel" data-campaign="${k}" data-selected="${state.campaign===k}" aria-pressed="${state.campaign===k}"><div class="campaign-head"><span class="circle">${c.icon}</span><span class="pill">${c.tag}</span></div><h3>${c.title}</h3><p>${c.sub}</p><p style="margin-top:13px;color:#b7cde2;font-size:12px">Аудитория: ${c.audience}</p></button>`}
function ready(){const rs=state.records.filter(r=>r.campaign===state.campaign);return `${head()}<section class="section"><div class="section-head"><h2>Избери сценарий</h2><span class="small">Два различни реални бизнес контекста</span></div><div class="grid">${campaignCard('defi')}${campaignCard('leads')}</div><div class="controls"><button class="primary" data-action="start">▶ Започни 4S Challenge</button><span class="small">A/B вариантът се избира на случаен принцип и не се показва предварително.</span></div><div class="info">След точно 4 секунди посланието изчезва. Отговаряш какво си разбрал и дали има значение за теб. Показаното „доказателство“ е изрично синтетично.</div><div class="kpis"><div class="kpi"><span>Локално започнати сесии</span><strong>${rs.length}</strong></div><div class="kpi"><span>Завършили въпросника</span><strong>${rs.filter(r=>r.understanding&&r.relevance).length}</strong></div><div class="kpi"><span>Симулирани CTA избори</span><strong>${rs.filter(r=>r.action==='explore').length}</strong></div></div><p class="small">Тези числа се събират само от ползването на този HTML файл в текущия браузър. Те не са резултати от външна кампания.</p></section>`}
function step(n,label){return `<div class="step"><span class="eyebrow">${n} / ${label}</span><span class="pill accent">4S-EXP-001 · DEMO</span></div>`}
function hook(){return `<div class="stage"><section class="panel">${step('01','ATTENTION')}<div class="clock" id="clock" aria-label="Оставащо време">4.0</div><h2 class="impact">${esc(state.session.hook)}</h2><div class="track"><div id="progress" class="fill"></div></div><p class="small">Прочети посланието. След 4 секунди ще изчезне автоматично.</p><div class="controls"><button class="ghost" data-action="interrupt">Прекрати теста</button></div></section></div>`}
function reflection(){return `<div class="stage"><section class="panel">${step('02','REFLECTION')}<h2>Какво остана в съзнанието ти?</h2><p>Не връщаме посланието. Отговори според това, което действително си запомнил.</p><div class="fields"><fieldset><legend>За какво беше посланието?</legend>${[['risk','Риск или възможна загуба'],['delay','Закъсняла реакция / пропусната възможност'],['value','Конкретна полезна възможност'],['unclear','Не разбрах достатъчно']].map(([v,l])=>`<label class="choice"><input type="radio" name="understanding" value="${v}"><span>${l}</span></label>`).join('')}</fieldset><fieldset><legend>Този проблем има ли значение лично за теб или твоя бизнес?</legend>${[['yes','Да, пряко ме засяга'],['maybe','Възможно е, но не съм сигурен'],['no','Не е релевантно за мен']].map(([v,l])=>`<label class="choice"><input type="radio" name="relevance" value="${v}"><span>${l}</span></label>`).join('')}</fieldset><label for="memory" class="label">Коя дума или мисъл запомни? (по желание, без лични данни)</label><textarea id="memory" maxlength="280" placeholder="Например: Колко късно разбирам за риска?"></textarea></div><p id="form-error" class="error" role="alert"></p><div class="controls"><button class="primary" data-action="submit-reflection">Запази отговора →</button></div></section></div>`}
function chooseProof(){return `<div class="stage"><section class="panel">${step('03','PROOF')}<h2>Би ли поискал доказателство?</h2><p>Посланието е само началото. Следващата стъпка е да проверим дали те мотивира да видиш конкретен пример.</p><div class="controls"><button class="primary" data-action="see-proof">Покажи ми пример →</button><button class="secondary" data-action="skip-proof">Не, това не ме заинтригува</button></div></section></div>`}
function proof(){const c=campaigns[state.session.campaign];return `<div class="stage"><section class="panel">${step('04','EVIDENCE')}<h2>Ето как би изглеждало доказателство</h2><p>Това е интерфейсна илюстрация. Не представяме синтетичните данни за измерен резултат.</p><div class="proof"><div class="proof-head"><strong>${c.proofTitle}</strong><span class="pill">SYNTHETIC DATA</span></div>${c.proofRows.map(([l,v],i)=>`<div class="proof-row"><span class="metric">${l}</span><strong ${i===2?'style="color:var(--amber)"':''}>${esc(v)}</strong></div>`).join('')}<div class="bars"><i></i><i></i><i></i><i class="hot"></i><i class="hot"></i><i></i></div><p style="font-size:11px;color:#90a5be;margin:9px 0 0">${c.proofNote}</p></div><h3>Този пример помага ли да разбереш стойността?</h3><div class="controls"><button class="primary" data-action="proof-helpful">Да, бих продължил →</button><button class="secondary" data-action="proof-not-helpful">Не ме убеждава →</button></div></section></div>`}
function action(){return `<div class="stage"><section class="panel">${step('05','ACTION')}<h2>Би ли предприел следваща стъпка?</h2><p>Това е тест на намерението, а не реална продажба. Натискането няма да изпрати контактните ти данни никъде.</p><div class="controls"><button class="primary" data-action="cta-explore">Explore the demo →</button><button class="secondary" data-action="cta-no">Не сега</button></div></section></div>`}
function done(){const s=state.session;return `<div class="stage"><section class="panel">${step('✓','RECORDED LOCALLY')}<h2>${s?.invalid?'Тестът беше прекъснат':'Изборът е записан.'}</h2><p>${s?.invalid?'Показването не е валидно за сравнение.':'Съхранихме реакциите само в този браузър. Това е демонстрационен сигнал, не доказателство за маркетингова ефективност.'}</p><div class="proof"><div class="proof-row"><span class="metric">Експеримент</span><strong style="font-size:14px">${esc(s?.id)}</strong></div><div class="proof-row"><span class="metric">Вариант</span><strong>${esc(s?.variant)}</strong></div><div class="proof-row"><span class="metric">Значение за участника</span><strong style="font-size:14px">${esc(({yes:'Да',maybe:'Може би',no:'Не'})[s?.relevance]||'—')}</strong></div><div class="proof-row"><span class="metric">Избор за следваща стъпка</span><strong style="font-size:14px">${esc(({explore:'Explore',none:'Няма интерес'})[s?.action]||'—')}</strong></div></div><div class="controls"><button class="primary" data-action="new">Нов 4S тест</button><button class="secondary" data-nav="results">Виж A/B резултатите →</button></div></section></div>`}
function per(k,v){const rr=state.records.filter(r=>r.campaign===k&&r.variant===v&&!r.invalid);return {started:rr.length,complete:rr.filter(r=>r.exposureCompleted).length,relevance:rr.filter(r=>r.relevance==='yes').length,proof:rr.filter(r=>r.proofViewed).length,cta:rr.filter(r=>r.action==='explore').length}}
function result(){const c=campaigns[state.campaign],data=state.records.filter(r=>r.campaign===state.campaign);let a=per(state.campaign,'A'),b=per(state.campaign,'B');return `${head()}<section class="section"><div class="section-head"><h2>Локални реакции · A/B</h2><span class="pill">DEMO SIGNALS · NOT VALIDATED</span></div><div class="grid">${campaignCard('defi')}${campaignCard('leads')}</div><div class="panel" style="margin-top:18px"><div class="resultRow header"><span>Вариант и послание</span><span>Стартирани</span><span>Видели 4s</span><span>Засяга ме</span><span>Explore</span></div>${[['A',a],['B',b]].map(([v,x])=>`<div class="resultRow"><div><span class="pill accent">${v}</span><div class="hooktext">${esc(c.hooks[v])}</div></div><strong>${x.started}</strong><strong>${x.complete}</strong><strong>${x.relevance}</strong><strong>${x.cta}</strong></div>`).join('')}<div class="rule"></div><p class="small">„Explore“ е само локално отбелязано намерение. <strong>Не е lead, покупка или доказателство за конверсия.</strong> Не правим заключение кой вариант печели при малка или несъпоставима извадка.</p><div class="controls"><button class="primary" data-action="export-json">↓ Export JSON</button><button class="secondary" data-action="export-csv">↓ Export CSV</button><button class="ghost" data-action="reset">Изчисти локалните записи</button></div><p class="small">Общо ${data.length} локални стартирания за този сценарий; ${data.filter(r=>r.invalid).length} невалидни/прекъснати показвания. Експортът включва всички локални сценарии, timestamps, варианти, реакции и събития.</p></div><div class="info warn">Не е проведен външен експеримент с реална маркетингова аудитория. Демо реакциите не променят gate-а: 4S-EXP-001 остава EVIDENCE REQUIRED.</div></section>`}
function method(){return `${head()}<section class="section"><div class="section-head"><h2>Какво всъщност тестваме?</h2><span class="small">4S SIGNAL METHOD · concept v0.1</span></div><div class="method"><div class="panel"><span class="label">01</span><strong>Attention</strong><p class="small">Равни 4 секунди видимост на началното послание.</p></div><div class="panel"><span class="label">02</span><strong>Reflection</strong><p class="small">Разбиране и лична релевантност след скриване на текста.</p></div><div class="panel"><span class="label">03</span><strong>Proof</strong><p class="small">Желание за доказателство и оценка на пример.</p></div><div class="panel"><span class="label">04</span><strong>Action</strong><p class="small">Изрично намерение да се продължи към демо.</p></div></div><div class="panel" style="margin-top:18px"><h2 style="font-size:22px;margin-top:0">Какво НЕ доказва това демо?</h2><p>Само по себе си то не измерва реално гледане, внимание, задържане в социални платформи, реакция на широк пазар или платени клиенти. Ограничава видимостта на текста до 4 секунди и записва доброволните отговори на човек, използващ файла.</p><p>За <strong>4S-EXP-001</strong> са нужни реални, съпоставими участници, подходяща процедура за A/B разпределение, проверен произход на данните и предварително определени критерии. 4 секунди са работна хипотеза, не универсално доказан праг.</p><div class="info">Поверителност: няма бекенд, cookies или външни заявки. Записите се пазят в localStorage на този браузър, когато е разрешен; JSON/CSV се изтеглят само при натискане на бутона. Не въвеждай лични данни в свободното поле.</div><div class="controls"><button class="primary" data-nav="test">← Изпробвай Challenge</button></div></div></section>`}
function render(){document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===state.nav));let html=state.nav==='results'?result():state.nav==='method'?method():state.phase==='hook'?hook():state.phase==='reflection'?reflection():state.phase==='choose-proof'?chooseProof():state.phase==='proof'?proof():state.phase==='action'?action():state.phase==='done'?done():ready();main.innerHTML=html}
function start(){if(state.timer){cancelAnimationFrame(state.timer);state.timer=null}let campaign=state.campaign,variant=rand()<.5?'A':'B',c=campaigns[campaign];let s={id:id(),campaign,variant,hook:c.hooks[variant],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),phase:'hook',exposureCompleted:false,exposureDurationMs:null,invalid:false,understanding:null,relevance:null,memory:'',proofViewed:false,proofHelpful:null,action:null,completedAt:null,events:[{at:new Date().toISOString(),type:'start'}]};state.session=s;state.records.push(s);save();state.phase='hook';render();state.startedPerf=performance.now();function tick(now){if(state.phase!=='hook')return;let elapsed=now-state.startedPerf,remaining=Math.max(0,4000-elapsed);const clock=document.getElementById('clock'),progress=document.getElementById('progress');if(clock)clock.textContent=(remaining/1000).toFixed(1);if(progress)progress.style.width=(remaining/4000*100)+'%';if(elapsed>=4000){s.exposureCompleted=true;s.exposureDurationMs=Math.round(elapsed);event('four_second_exposure_complete',{elapsedMs:Math.round(elapsed)});state.timer=null;setPhase('reflection')}else state.timer=requestAnimationFrame(tick)}state.timer=requestAnimationFrame(tick)}
function interrupt(reason='user'){if(state.phase!=='hook')return;if(state.timer)cancelAnimationFrame(state.timer);state.timer=null;state.session.invalid=true;state.session.exposureDurationMs=Math.round(performance.now()-state.startedPerf);event('interrupted',{reason});setPhase('done')}
function complete(action){const s=state.session;s.action=action;s.completedAt=new Date().toISOString();event('completed',{action});setPhase('done')}
function download(name,data,type){const blob=new Blob([data],{type});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
function csvCell(v){return '"'+String(v??'').replaceAll('"','""').replace(/[\r\n]+/g,' ')+'"'}
function exportRecords(kind){if(!state.records.length){alert('Все още няма локални записи за експортиране.');return}const dt=new Date().toISOString().slice(0,10);if(kind==='json')download(`4S-local-demo-${dt}.json`,JSON.stringify({schema:'4s-signal-lab/v1',kind:'local-demo-test-only',exportedAt:new Date().toISOString(),records:state.records},null,2),'application/json;charset=utf-8');else {const cols=['id','campaign','variant','hook','createdAt','exposureCompleted','exposureDurationMs','invalid','understanding','relevance','memory','proofViewed','proofHelpful','action','completedAt'];const csv='\uFEFF'+[cols.join(','),...state.records.map(r=>cols.map(k=>csvCell(r[k])).join(','))].join('\r\n');download(`4S-local-demo-${dt}.csv`,csv,'text/csv;charset=utf-8')}}
document.addEventListener('click',(e)=>{const b=e.target.closest('[data-nav],[data-campaign],[data-action]');if(!b)return;if(b.dataset.nav){if(state.phase==='hook'){interrupt('navigation')}state.nav=b.dataset.nav;render();return}if(b.dataset.campaign){state.campaign=b.dataset.campaign;state.phase='ready';render();return}const a=b.dataset.action;const s=state.session;if(a==='start'){start();return}if(a==='interrupt'){interrupt();return}if(a==='new'){state.nav='test';state.phase='ready';state.session=null;render();return}if(a==='submit-reflection'){const understanding=document.querySelector('input[name="understanding"]:checked')?.value,relevance=document.querySelector('input[name="relevance"]:checked')?.value;if(!understanding||!relevance){document.getElementById('form-error').textContent='Избери по един отговор и на двата въпроса.';return}s.understanding=understanding;s.relevance=relevance;s.memory=document.getElementById('memory').value.trim().slice(0,280);event('reflection_submitted',{understanding,relevance});setPhase('choose-proof');return}if(a==='see-proof'){s.proofViewed=true;event('proof_requested');setPhase('proof');return}if(a==='skip-proof'){event('proof_declined');complete('none');return}if(a==='proof-helpful'||a==='proof-not-helpful'){s.proofHelpful=a==='proof-helpful';event('proof_rated',{helpful:s.proofHelpful});setPhase('action');return}if(a==='cta-explore'||a==='cta-no'){complete(a==='cta-explore'?'explore':'none');return}if(a==='export-json'){exportRecords('json');return}if(a==='export-csv'){exportRecords('csv');return}if(a==='reset'){if(confirm('Да изтрия ли всички локални записи от този браузър? Изтегли JSON преди изтриване, ако са ти нужни.')){state.records=[];save();render()}return}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.phase==='hook')interrupt('tab-hidden')});
render();
})();
</script>
</body>
